<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익산웨스턴라이프 갤러리</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .gallery-item:hover {
            transform: translateY(-5px);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .banner {
            grid-column: 1 / -1;
        }
        .banner img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="gallery-grid">
            <div class="banner">
                <img src="https://arms00.github.io/jbmeta/익산 웨스턴라이프/웨스턴라이프 배너.jpg" alt="사진1">
            </div>
            <div class="gallery-item">
                <img src="https://arms00.github.io/jbmeta/익산 웨스턴라이프/KakaoTalk_20250211_084141775_07.jpg" alt="사진2">
            </div>
            <div class="gallery-item">
                <img src="https://arms00.github.io/jbmeta/익산 웨스턴라이프/KakaoTalk_20250211_090549295.jpg" alt="사진3">
            </div>
            <div class="gallery-item">
                <img src="https://arms00.github.io/jbmeta/익산 웨스턴라이프/KakaoTalk_20250211_120147090.jpg" alt="사진4">
            </div>
            <div class="gallery-item">
                <img src="https://arms00.github.io/jbmeta/익산 웨스턴라이프/웨스턴라이프 강의장,배너.jpg" alt="사진5">
