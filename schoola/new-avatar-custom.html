<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Character Customization</title>            
    <script type="importmap">        
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
            }
        }        
    </script>        
    <link rel="stylesheet" href="https://arms00.github.io/schoola/new-avatar-custom.css?v=1.0.1" />
</head>
<script type="module">
    window.DEBUG_MODE = true;
    window.characterPresetIndex = 3; // 예: 1=아카데믹, 2=에너제틱, 3=단정캐주얼, 4=크리에이티브, 5=퓨처리스틱    
    import 'https://arms00.github.io/schoola/ai-utils.js';
    import 'https://arms00.github.io/schoola/ai-avatar-custom.js';    
    import 'https://arms00.github.io/schoola/new-avatar-custom.js';    
</script>
<body>    
    <!-- AI 대화창 모달 추가 -->
    <div id="aiChatModal" class="ai-chat-modal">
        <div class="ai-chat-container">
        <div class="ai-chat-header">
            <div class="gender-buttons-group">
                <button id="femaleButton" class="preset-button gender-button">여성</button>
                <button id="maleButton" class="preset-button gender-button">남성</button>
            </div>
            <h3>AI 캐릭터 커스터마이징&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</h3>
            <span id="aiChatClose" class="chat-close-button">&times;</span>
        </div>        
        <!-- API 키 입력 대화상자 -->
        <div id="apiKeyModal" class="api-key-modal">
            <div class="api-key-container">
            <div class="api-key-header">
                <h4>OpenAI API 키 설정</h4>
                <span id="apiKeyClose" class="api-key-close">&times;</span>
            </div>
            <div class="api-key-content">
                <p>OpenAI API 키를 입력하세요:</p>
                <input type="password" id="apiKeyInput" placeholder="sk-..." />
                <div class="api-key-status" id="apiKeyStatus"></div>
                <button id="apiKeySave">저장</button>
            </div>
            </div>
        </div>        
        <div id="aiChatMessages" class="ai-chat-messages">
            <div class="ai-message">안녕하세요! 원하는 캐릭터 스타일을 설명해주세요.</div>            
        </div>        
        <div class="ai-chat-input-container">
            <input type="text" id="aiChatInput" placeholder="예: 스포티한 스타일로 만들어줘" />
            <button id="aiChatSend">전송</button>
        </div>
        <div id="api-status" class="api-status"></div>
        <div id="conversation-status"></div>
        </div>           
    </div>
    <div id="avatarCustom-content">        
        <div id="avatarUrl"></div>
        <div class="frame-container">
            <iframe id="frame" class="frame" allow="camera *; microphone *; clipboard-write" hidden></iframe>
            <div id="frame-overlay" class="overlay"></div>
            <div class="settings-overlay" onclick="history.back()"><svg width="65%" height="65%" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.5 6.875V5.312a1.563 1.563 0 0 0-1.563-1.562h-7.5a1.562 1.562 0 0 0-1.562 1.562v9.375a1.562 1.562 0 0 0 1.563 1.563h7.5a1.562 1.562 0 0 0 1.562-1.563v-1.562" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M16 6.875 19.125 10 16 13.125" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8.46 10h10.665" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>            
            <span id="sw-switch" class="block-overlay-1">
            </span> <span class="block-overlay-2"></span>            
            <div class="preset-overlay">                
                <button id="aiToggleBtn" class="preset-button ai-button active">✨AI</button>                                
                <button onclick="window.setPreset(2)" class="preset-button" id="presetBtn2">에너제틱</button>
                <button onclick="window.setPreset(3)" class="preset-button" id="presetBtn3">단정캐주얼</button>
                <button onclick="window.setPreset(4)" class="preset-button" id="presetBtn4">크리에이티브</button>
                <button onclick="window.setPreset(5)" class="preset-button" id="presetBtn5">퓨처리스틱</button>                
            </div>
        </div>
        <div id="avatarModal" class="modal">
            <div class="modal-content">
                <span id="modalClose" class="close-button">&times;</span>
                <canvas id="modalCanvas"></canvas>
                <button id="exportButton" class="export-button">Download</button>
            </div>
        </div>            
    </div>

    <!-- 데이터 태그 추가 -->
    <data id="avatarGLBUrlData" value=""></data>
    <data id="modelJSONData" value=""></data>
    <data id="avatarModalModelData" value=""></data>
    
    <script>                
        const exportButton = document.getElementById('exportButton');
        exportButton.addEventListener('click', async () => {
            if (window.exportGLB) {
                try {
                    const result = await window.exportGLB();
                    console.log('Exported GLB Model:', result);                    
                } catch (error) {
                    console.error('Export failed:', error);
                }
            } else {
                console.error('exportGLB 함수가 정의되지 않았습니다.');
            }
        });

        function serializeAvatarModalModel(model) {
            if (!model) return '';

            const exporter = new THREE.GLTFExporter();
            let serialized = '';

            exporter.parse(model, function (result) {
                serialized = JSON.stringify(result, null, 2);
            }, { binary: false });

            return serialized;
        }

        function deserializeAvatarModalModel(serializedModel) {
            const loader = new THREE.GLTFLoader();
            let model = null;

            loader.parse(serializedModel, '', function (gltf) {
                model = gltf.scene;
                // 필요한 추가 설정
            }, function (error) {
                console.error('모델 역직렬화 중 오류 발생:', error);
            });

            return model;
        }

        // AI 창 ON/OFF 토글
        const aiToggleBtn = document.getElementById('aiToggleBtn');
        aiToggleBtn.addEventListener('click', () => {
            aiToggleBtn.classList.toggle('active');
            const aiChatModal = document.getElementById('aiChatModal');
            aiChatModal.style.display = aiToggleBtn.classList.contains('active') ? 'block' : 'none';
        });

        window.updatePresetButtons = updatePresetButtons;

        function updatePresetButtons(index) {
            const presetButtons = document.querySelectorAll('[id^="presetBtn"]');
            presetButtons.forEach(btn => {
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                }
            });
            const selectedButton = document.getElementById(`presetBtn${index}`);
            if (selectedButton) {
                selectedButton.classList.add('active');
            }
        }

        // 초기 프리셋 버튼 상태 반영
        window.updatePresetButtons(window.characterPresetIndex || 3);

        // AI 버튼 초기 상태 & 토글        
        document.addEventListener('DOMContentLoaded', () => {

            setTimeout(() => {
                window.start();
            }, 100);

            console.log('Window size:', window.innerWidth, 'x', window.innerHeight);
            console.log('Device pixel ratio:', window.devicePixelRatio);
            console.log('User agent:', navigator.userAgent);

            // 요소 참조
            const aiButton = document.getElementById('aiToggleBtn');
            const aiChatModal = document.getElementById('aiChatModal');
            const aiChatClose = document.getElementById('aiChatClose');            
            const aiChatMessages = document.getElementById('aiChatMessages');
            const aiChatHeader = document.querySelector('.ai-chat-header');    
            const aiToggleBtn = document.getElementById('aiToggleBtn');

            // 닫기 버튼
            document.getElementById('aiChatClose').addEventListener('click', () => {
                aiChatModal.style.display = 'none';
            });

            // 드래그 관련 변수
            let isDragging = false;
            let offsetX, offsetY;

            // 마우스 다운 이벤트 - 드래그 시작
            aiChatHeader.addEventListener('mousedown', (e) => {
                isDragging = true;
                
                // 현재 창의 위치를 기준으로 마우스 위치의 차이 계산
                const rect = aiChatModal.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                
                // 드래그 중 커서 스타일 변경
                aiChatHeader.style.cursor = 'grabbing';
            });

            // 마우스 움직임 이벤트 - 드래그 중
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                // 새로운 위치 계산
                const x = e.clientX - offsetX;
                const y = e.clientY - offsetY;
                
                // 창이 화면 밖으로 나가지 않도록 제한
                const maxX = window.innerWidth - aiChatModal.offsetWidth;
                const maxY = window.innerHeight - aiChatModal.offsetHeight;
                
                // 위치 설정 (좌측 기준으로 설정)
                aiChatModal.style.left = `${Math.max(0, Math.min(maxX, x))}px`;
                aiChatModal.style.top = `${Math.max(0, Math.min(maxY, y))}px`;
                aiChatModal.style.right = 'auto'; // left로 위치 제어 시 right 해제
            });

            // 마우스 업 이벤트 - 드래그 종료
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                isDragging = false;
                aiChatHeader.style.cursor = 'move';
                }
            });
            
            // 마우스가 창 밖으로 나갔을 때도 드래그 종료
            document.addEventListener('mouseleave', () => {
                if (isDragging) {
                isDragging = false;
                aiChatHeader.style.cursor = 'move';
                }
            });
        
            // AI 버튼 클릭 이벤트
            aiButton.addEventListener('click', () => {
            aiChatModal.style.display = 'block';
            });
        
            // 닫기 버튼 이벤트
            aiChatClose.addEventListener('click', () => {
            aiChatModal.style.display = 'none';
            });
    
            // API 키 관련 요소
            const apiSettingsButton = document.getElementById('apiSettingsButton');
            const apiKeyModal = document.getElementById('apiKeyModal');
            const apiKeyClose = document.getElementById('apiKeyClose');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const apiKeyStatus = document.getElementById('apiKeyStatus');
            const apiKeySave = document.getElementById('apiKeySave');
            
            let apiKey = localStorage.getItem('openai_api_key') || '';            
            
            // API 키 모달 제어
            if (apiSettingsButton) {
                apiSettingsButton.addEventListener('click', () => {
                    apiKeyInput.value = apiKey ? '••••••••••••••••••••••' : '';
                    apiKeyModal.style.display = 'block';
                });
            }    
            
            apiKeyClose.addEventListener('click', () => {
                apiKeyModal.style.display = 'none';
            });
            
            // API 키 저장
            apiKeySave.addEventListener('click', async () => {
                const newApiKey = apiKeyInput.value;
                
                // 입력된 키가 마스킹된 값이면 변경하지 않음
                if (newApiKey === '••••••••••••••••••••••') {
                apiKeyModal.style.display = 'none';
                return;
                }
                
                // API 키 형식 검사
                if (!newApiKey.startsWith('sk-')) {
                apiKeyStatus.textContent = '올바른 API 키 형식이 아닙니다.';
                apiKeyStatus.style.color = 'red';
                return;
                }
                
                apiKeyStatus.textContent = '키 확인 중...';
                apiKeyStatus.style.color = 'blue';
                
                try {
                // API 키 유효성 검사
                const isValid = await validateApiKey(newApiKey);
                
                if (isValid) {
                    apiKey = newApiKey;
                    localStorage.setItem('openai_api_key', apiKey);
                    apiKeyStatus.textContent = '유효한 API 키입니다!';
                    apiKeyStatus.style.color = 'green';
                    setTimeout(() => {
                    apiKeyModal.style.display = 'none';
                    apiKeyStatus.textContent = '';
                    }, 1500);
                } else {
                    apiKeyStatus.textContent = '유효하지 않은 API 키입니다.';
                    apiKeyStatus.style.color = 'red';
                }
                } catch (error) {
                apiKeyStatus.textContent = '키 확인 중 오류가 발생했습니다.';
                apiKeyStatus.style.color = 'red';
                console.error('API 키 검증 오류:', error);
                }
            });

            
            // API 키 유효성 검사
            async function validateApiKey(key) {
                try {
                const response = await fetch('https://api.openai.com/v1/models', {
                    method: 'GET',
                    headers: {
                    'Authorization': `Bearer ${key}`
                    }
                });
                
                return response.status === 200;
                } catch (error) {
                console.error('API 키 검증 오류:', error);
                return false;
                }
            }

            // 성별 토글 버튼 요소 가져오기
            const femaleButton = document.getElementById('femaleButton');
            const maleButton = document.getElementById('maleButton');

            femaleButton.addEventListener('click', () => {
                window.characterGender = 'F';
                window.start('female');        
            });

            maleButton.addEventListener('click', () => {
                window.characterGender = 'M';
                window.start('male');        
            });
            
            // 모바일 환경 감지
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
            
            if (isMobile) {
                // 모바일에서 채팅창 스크롤 시 최상단으로 자동 이동 방지
                const aiChatMessages = document.getElementById('aiChatMessages');
                if (aiChatMessages) {
                    aiChatMessages.style.overscrollBehavior = 'contain';
                }

                const aiChatInput = document.getElementById('aiChatInput');
                if (aiChatInput) {
                    aiChatInput.setAttribute('onfocus', 'this.blur()');  // 처음 로드 시 포커스 방지
                    // 사용자가 탭했을 때만 입력 가능하도록
                    aiChatInput.addEventListener('click', function() {
                        this.removeAttribute('onfocus');
                    });
                }

                // 모바일 최적화 클래스 추가
                document.body.classList.add('mobile-view');
                
                // 타이틀 간소화 (공백 제거)
                const chatTitle = document.querySelector('.ai-chat-header h3');
                if (chatTitle) {
                    chatTitle.innerHTML = 'AI 캐릭터 커스터마이징';
                }
                
                // 모바일 최적화 클래스 추가
                document.body.classList.add('mobile-device');
                
                // 입력 필드와 버튼 레이아웃 최적화
                const inputContainer = document.querySelector('.ai-chat-input-container');
                const inputField = document.getElementById('aiChatInput');
                const sendButton = document.getElementById('aiChatSend');
                
                if (inputContainer && inputField && sendButton) {
                // 플레이스홀더 텍스트 줄이기
                inputField.setAttribute('placeholder', '메시지 입력...');
                
                // 전송 버튼 텍스트 아이콘으로 변경 (옵션)
                if (window.innerWidth <= 375) {
                    sendButton.textContent = '↑';
                }
                }

                // 대화창 높이 최대화
                const adjustChatHeight = () => {
                    const chatMessages = document.getElementById('aiChatMessages');
                    const header = document.querySelector('.ai-chat-header');
                    const input = document.querySelector('.ai-chat-input-container');

                    if (chatMessages && header && input) {
                        const headerHeight = header ? header.offsetHeight : 0;
                        const inputHeight = input ? input.offsetHeight : 0;
                        const windowHeight = window.innerHeight;
                        const modalHeight = document.querySelector('.ai-chat-modal').offsetHeight;
                        
                        // 채팅창 높이 계산 (화면 높이 - 헤더 - 입력창 - 여유공간)
                        //const chatHeight = windowHeight - headerHeight - inputHeight - 20;
                        const chatHeight = modalHeight - headerHeight - inputHeight - 10;
                        chatMessages.style.height = `${chatHeight}px`;
                    }
                };
                
                // 초기 높이 조정 및 리사이징 이벤트에 연결
                adjustChatHeight();
                window.addEventListener('resize', adjustChatHeight);
                
                // 입력창 패딩 최소화
                const chatInput = document.getElementById('aiChatInput');
                if (chatInput) {
                    chatInput.style.padding = '6px';
                }
            }

            setTimeout(optimizeForTinyScreens, 500); 

            // 처음부터 켜져 있으므로
            aiChatModal.style.display = 'block';
            aiToggleBtn.classList.add('active');
            aiToggleBtn.addEventListener('click', () => {
                const isActive = aiToggleBtn.classList.toggle('active');
                aiChatModal.style.display = isActive ? 'block' : 'none';
            });
            // 초기 프리셋 버튼 활성화
            window.updatePresetButtons(window.characterPresetIndex || 3);
        });

        // 초소형 화면에서의 레이아웃 최적화
        function optimizeForTinyScreens() {
            const isTinyScreen = window.innerWidth <= 457;
            const inputContainer = document.querySelector('.ai-chat-input-container');
            const chatMessages = document.getElementById('aiChatMessages');
            
            if (inputContainer && chatMessages && isTinyScreen) {
                // 수직 레이아웃 강제 적용
                inputContainer.style.flexDirection = 'column';
                
                // 입력창 높이 재조정
                const header = document.querySelector('.ai-chat-header');
                const modalHeight = document.querySelector('.ai-chat-modal').offsetHeight;
                const headerHeight = header ? header.offsetHeight : 0;
                const inputHeight = inputContainer.offsetHeight;
                
                // 높이 계산 및 적용
                chatMessages.style.height = `${modalHeight - headerHeight - inputHeight - 15}px`;
            }
        }
    </script>
</body>                    
</html>
